# Quick Docker Compose for Web Koperasi UMB

services:
  # MySQL Database (reuse existing)
  database:
    image: mysql:8.0
    container_name: koperasi-db-docker
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: koperasi_umb
      MYSQL_USER: koperasi_user
      MYSQL_PASSWORD: KoperasiUMB2025!
    ports:
      - "3308:3306"  # Different port to avoid conflicts
    volumes:
      - mysql_docker_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      timeout: 10s
      interval: 30s
      retries: 5
    networks:
      - koperasi-net

  # Next.js Application (using fast build)
  app:
    image: web-koperasi-umb:fast
    container_name: koperasi-app-docker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://koperasi_user:KoperasiUMB2025!@database:3306/koperasi_umb
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=Imr7y2cewLUhdKMTXGvFax6si1YVQZqn
      - JWT_SECRET=bW7H8LEMdfVuPFoXzrv3a05jiCN9plRkyG1SD4tATQ2hKUngIeJZYBx6qscOmw
    ports:
      - "3002:3000"  # Port 3002 for Docker version
    depends_on:
      database:
        condition: service_healthy
    networks:
      - koperasi-net

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: koperasi-adminer-docker
    restart: unless-stopped
    ports:
      - "8082:8080"  # Port 8082 for Docker version
    depends_on:
      - database
    networks:
      - koperasi-net

volumes:
  mysql_docker_data:
    driver: local

networks:
  koperasi-net:
    driver: bridge