# Docker Compose for Web Koperasi UMB - Using Docker Hub Image
# This file uses pre-built image from Docker Hub
# Anyone can run: docker-compose -f docker-compose.hub.yml up -d

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: koperasi-mysql-hub
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: koperasi_umb
      MYSQL_USER: koperasi_user
      MYSQL_PASSWORD: KoperasiUMB2025!
    ports:
      - "3306:3306"
    volumes:
      - mysql_hub_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      timeout: 10s
      interval: 30s
      retries: 5
    networks:
      - koperasi-hub-net

  # Web Application from Docker Hub
  app:
    image: aegneru77/web-koperasi-umb:latest
    container_name: koperasi-app-hub
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://koperasi_user:KoperasiUMB2025!@database:3306/koperasi_umb
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=Imr7y2cewLUhdKMTXGvFax6si1YVQZqn
      - JWT_SECRET=bW7H8LEMdfVuPFoXzrv3a05jiCN9plRkyG1SD4tATQ2hKUngIeJZYBx6qscOmw
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - koperasi-hub-net

  # Database Administration
  adminer:
    image: adminer:latest
    container_name: koperasi-adminer-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - koperasi-hub-net

volumes:
  mysql_hub_data:
    driver: local

networks:
  koperasi-hub-net:
    driver: bridge