# Docker Compose for Web Koperasi UMB with Prisma MySQL

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: koperasi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: koperasi_umb
      MYSQL_USER: koperasi_user
      MYSQL_PASSWORD: KoperasiUMB2025!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./complete-database-setup.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "3306:3306"
    networks:
      - koperasi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      timeout: 10s
      retries: 5
      interval: 30s

  # Web Application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: koperasi-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://koperasi_user:KoperasiUMB2025!@database:3306/koperasi_umb
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=Imr7y2cewLUhdKMTXGvFax6si1YVQZqn
      - JWT_SECRET=bW7H8LEMdfVuPFoXzrv3a05jiCN9plRkyG1SD4tATQ2hKUngIeJZYBx6qscOmw
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - koperasi-network
    volumes:
      - ./uploads:/app/uploads
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prisma Studio (optional - for database management)
  prisma-studio:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: koperasi-prisma-studio
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://koperasi_user:KoperasiUMB2025!@database:3306/koperasi_umb
    ports:
      - "5555:5555"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - koperasi-network
    command: ["npx", "prisma", "studio", "--port", "5555", "--hostname", "0.0.0.0"]

  # Database Administration
  adminer:
    image: adminer:latest
    container_name: koperasi-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - koperasi-network
    depends_on:
      - database

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: koperasi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - koperasi-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Database Backup Service (runs daily at 2 AM)
  backup:
    image: mysql:8.0
    container_name: koperasi-backup
    restart: unless-stopped
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=koperasi_user
      - MYSQL_PASSWORD=KoperasiUMB2025!
      - MYSQL_DATABASE=koperasi_umb
      - BACKUP_RETENTION=30
    volumes:
      - ./backups:/backups
      - ./scripts/docker-backup.sh:/backup.sh:ro
    networks:
      - koperasi-network
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Install cron
        apt-get update && apt-get install -y cron
        
        # Create backup script
        cat > /usr/local/bin/backup-db.sh << 'EOF'
        #!/bin/bash
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        BACKUP_FILE="/backups/koperasi_umb_$${TIMESTAMP}.sql"
        
        echo "[INFO] Starting backup at $$(date)"
        
        mysqldump -h$$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE > $$BACKUP_FILE
        
        if [ $$? -eq 0 ]; then
          echo "[SUCCESS] Backup created: $$BACKUP_FILE"
          
          # Keep only last 30 backups
          cd /backups
          ls -t koperasi_umb_*.sql | tail -n +31 | xargs -r rm
          echo "[INFO] Cleanup complete - keeping last 30 backups"
        else
          echo "[ERROR] Backup failed!"
        fi
        EOF
        
        chmod +x /usr/local/bin/backup-db.sh
        
        # Add cron job (daily at 2 AM)
        echo "0 2 * * * /usr/local/bin/backup-db.sh >> /var/log/backup.log 2>&1" | crontab -
        
        echo "[INFO] Backup service started - running daily at 2 AM"
        echo "[INFO] Manual backup: docker exec koperasi-backup /usr/local/bin/backup-db.sh"
        
        # Keep container running
        cron && tail -f /var/log/backup.log

networks:
  koperasi-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local